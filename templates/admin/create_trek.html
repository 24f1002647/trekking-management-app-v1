{% extends "base.html" %}
{% block title %}
Trek Creation
{% endblock title %}
{% block content %}
<div class="container">
    <h2 class="mb-4">Create Trek</h2>

    <form method="POST">
        <div class="mb-3">
            <label for="name" class="form-label">Trek Name</label>
            <input type="text" class="form-control" id="name" name="name" required>
        </div>
        <div class="mb-3">
            <label for="location" class="form-label">Trek Location</label>
            <input type="text" class="form-control" id="location" name="location" required>
        </div>
        <div class="mb-3">
            <label for="description" class="form-label">Trek Description</label>
            <textarea class="form-control" id="description" name="description" rows="2"></textarea>
        </div>
        <div class="mb-3">
            <label for="difficulty" class="form-label">Select Difficulty</label>
            <select name="difficulty" id="difficulty" class="form-select" required>
                <option value="">-- Select the Difficulty --</option>
                <option value="Easy">Easy</option>
                <option value="Moderate">Moderate</option>
                <option value="Hard">Hard</option>
            </select>
        </div>
        <div class="mb-3">
            <label for="duration" class="form-label">Trek Duration</label>
            <input type="number" class="form-control" id="duration" name="duration" min="1" required>
        </div>
        <div class="mb-3">
            <label for="capacity" class="form-label">Trek Capacity</label>
            <input type="number" class="form-control" id="capacity" name="capacity" min="1" required>
        </div>
        <div class="mb-3">
            <label for="start_date" class="form-label">Trek Start Date</label>
            <input type="date" class="form-control" id="start_date" name="start_date" required>
        </div>
        <div class="mb-3">
            <label for="end_date" class="form-label">Trek End Date</label>
            <input type="date" class="form-control" id="end_date" name="end_date" required>
        </div>
        <div class="mb-3">
            <label for="staff-id" class="form-label">Select Staff</label>
            <select name="staff_id" class="form-select" id="staff-id">
                <option value="">-- Select Staff --</option>

                {% for staff in staff_members %}
                <option value="{{ staff.id }}">
                    {{ staff.name }}
                </option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <a href="{{ url_for('admin.display_treks') }}" class="btn btn-secondary">
                Back
            </a>
            <button type="submit" class="btn btn-primary">Create Trek</button>
        </div>

    </form>
</div>
{% endblock content %}
